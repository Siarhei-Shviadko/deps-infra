{{- if .Values.create_secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: ocr-aws-credentials
type: Opaque
data:
  aws-access-key-id  : {{ default "test" .Values.secrets_values.aws_access_key_id  | b64enc | quote }}
  aws-secret-access-key: {{default (randAlphaNum 10 | quote) .Values.secrets_values.aws_secret_access_key | b64enc | quote}}
  aws-region-name: {{ default "test_region" .Values.secrets_values.aws_region_name | b64enc | quote }}
{{- end }}