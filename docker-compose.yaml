version: '3.2'

services:
  postgres:
    container_name: deps-postgres
    image: postgres:17.5
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=6553kB
    environment:
      POSTGRES_DB: deps
      POSTGRES_USER: deps-postgres
      POSTGRES_PASSWORD: deps-postgres-password
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deps-postgres -d deps"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [deps-network]


  kafka:
    profiles: ["kafka"]
    container_name: deps-kafka
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [deps-network]


  rabbitmq:
    container_name: deps-rabbitmq
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_VHOST: deps
      RABBITMQ_DEFAULT_USER: deps-rabbitmq
      RABBITMQ_DEFAULT_PASS: deps-rabbitmq-password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 20
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks: [deps-network]

networks:
  deps-network:
    name: deps-network
    external: true

volumes:
  postgres:
  rabbitmq:
  kafka_data:

