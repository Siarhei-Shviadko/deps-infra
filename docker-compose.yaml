version: '3.2'

services:
  postgres:
    container_name: deps-postgres
    image: postgres:17.5
    command: postgres
      -c 'max_connections=80'
      -c 'shared_buffers=128MB'
      -c 'effective_cache_size=384MB'
      -c 'maintenance_work_mem=32MB'
      -c 'checkpoint_completion_target=0.7'
      -c 'wal_buffers=3932kB'
      -c 'default_statistics_target=100'
      -c 'random_page_cost=1.1'
      -c 'effective_io_concurrency=200'
      -c 'work_mem=6553kB'
      -c 'min_wal_size=1GB'
      -c 'max_wal_size=4GB'
      -c 'max_worker_processes=2'
      -c 'max_parallel_workers_per_gather=1'
      -c 'max_parallel_workers=2'
      -c 'max_parallel_maintenance_workers=1'
    restart: 'no'
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=deps
      - POSTGRES_USER=deps-postgres
      - POSTGRES_PASSWORD=deps-postgres-password
      - PGDATA=/var/lib/postgresql/17/docker
    networks:
      - deps-network
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data


  zookeeper:
    image: "${REPOSITORY_URL}/base/zookeeper:3.8"
    ports:
      - "2181:2181"
    volumes:
      - "zookeeper_data:/bitnami"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - deps-network

  kafka:
    image: "${REPOSITORY_URL}/base/kafka:3.2"
    ports:
      - "9092:9092"
    volumes:
      - "kafka_data:/bitnami"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    networks:
      - deps-network


  rabbitmq:
    container_name: deps-rabbitmq
    image: "${REPOSITORY_URL}/base/rabbitmq:3.7.8-management-alpine"
    restart: 'no'
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_DEFAULT_VHOST=deps
      - RABBITMQ_DEFAULT_USER=deps-rabbitmq
      - RABBITMQ_DEFAULT_PASS=deps-rabbitmq-password
      - RABBITMQ_VHOST=deps
      - RABBITMQ_USER=deps-rabbitmq
      - RABBITMQ_PASS=deps-rabbitmq-password
    networks:
      - deps-network
    ports:
      - 15672:15672
      - 5672:5672
    volumes:
      - rabbitmq:/var/lib/rabbitmq

networks:
  deps-network:
    external:
      name: deps-network

volumes:
  static:
  blob:
  test_cache:
  test_coverage:
  logs:

  rabbitmq:
  postgres:

  zookeeper_data:
    driver: local
  kafka_data:
    driver: local
